[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-navigator-agent"
version = "0.1.0"
description = "Evidence-first personal knowledge navigation with scoped retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["navigator*"]

[tool.setuptools.package-data]
navigator = ["static/*", "demo.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
